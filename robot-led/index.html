
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030914">
<title>Next Level - Cyber Luxury Robot</title>

<style>
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #030914;
  font-family: Arial, sans-serif;
}

body {
  background:
    radial-gradient(ellipse at 50% 48%, #123654 0%, #071526 48%, #020711 100%);
}

#robot {
  position: relative;
  width: 100vw;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#connection {
  position: fixed;
  right: 14px;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(180,220,240,.55);
  font-size: 9px;
  letter-spacing: 1.5px;
  z-index: 5;
}

#connection .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ff7777;
  box-shadow: 0 0 9px #ff7777;
}

#connection.connected .dot {
  background: #35d9ff;
  box-shadow: 0 0 10px #35d9ff;
}

@media (orientation: portrait) {
  canvas {
    width: 100%;
    height: 100%;
  }
}
</style>
</head>

<body>
<div id="robot">
  <canvas id="face"></canvas>
</div>

<div id="connection">
  <span class="dot"></span>
  <span id="connectionText">CONNECTING</span>
</div>

<script>
const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d");

const connection = document.getElementById("connection");
const connectionText = document.getElementById("connectionText");


const CYAN = "#35D9FF";
const LIGHT = "#B8F7FF";
const WHITE = "#F5F7FA";
const DARK = "#071B36";
const NAVY = "#071B36";
const ORANGE = "#F47721";
const SILVER = "#AAB7C5";


let W = 0, H = 0, dpr = 1;
let scale = 1, offsetX = 0, offsetY = 0;

const DESIGN_W = 1000;
const DESIGN_H = 650;

let expression = "neutral";
let previousExpression = "neutral";
let expressionTransition = 1;
let blink = 1;
let blinkTarget = 1;
// Micro Expression - Eyebrow Animation
// Micro Expression - Eyebrow Animation
let eyebrowOffset = 0;
let targetEyebrowOffset = 0;

let eyebrowLeftOffset = 0;
let eyebrowRightOffset = 0;

let targetEyebrowLeft = 0;
let targetEyebrowRight = 0;

let nextEyebrowMove = 0;
let gazeX = 0;
let gazeY = 0;
let idleEyeOffsetX = 0;
let idleEyeOffsetY = 0;
let nextIdleEyeMove = 0;
let targetIdleEyeX = 0;
let targetIdleEyeY = 0;
let targetGazeX = 0;
let targetGazeY = 0;

let guestPresent = false;
let photoboothActive = false;
let expressionUntil = 0;
let nextIdleChange = performance.now() + 4000;
let lastGazeChange = 0;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  W = rect.width;
  H = rect.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  scale = Math.min(W / DESIGN_W, H / DESIGN_H);
  offsetX = (W - DESIGN_W * scale) / 2;
  offsetY = (H - DESIGN_H * scale) / 2;
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 250);
});
resizeCanvas();

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function glow(color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
}

function drawBackground(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Khôi phục tỷ lệ hiển thị theo màn hình
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W / 2;
  const cy = H / 2;
  const pulse = 0.09 + Math.sin(t * 0.0015) * 0.025;

  const aura = ctx.createRadialGradient(
    cx, cy, 5, cx, cy, Math.max(W, H) * 0.55
  );

  aura.addColorStop(0, `rgba(53,217,255,${pulse})`);
  aura.addColorStop(.5, "rgba(12,65,105,.08)");
  aura.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = aura;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Ánh sáng nền phía sau robot
  const halo = ctx.createRadialGradient(500, 320, 80, 500, 320, 430);
  halo.addColorStop(0, "rgba(30,140,190,.13)");
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

  ctx.restore();
}

// Khung kim loại cao cấp
function drawMetalFrame(t) {
  ctx.save();

  const float = Math.sin(t * .0012) * 3;
  ctx.translate(0, float);


  // Lớp vỏ ngoài
  const metal = ctx.createLinearGradient(180, 80, 820, 570);
  metal.addColorStop(0, "#17283b");
  metal.addColorStop(.15, "#d8e5ef");
  metal.addColorStop(.28, "#536c82");
  metal.addColorStop(.5, "#172b40");
  metal.addColorStop(.75, "#a8bdce");
  metal.addColorStop(1, "#253b50");

  ctx.fillStyle = metal;
  roundedRect(180, 105, 640, 435, 105);
  ctx.fill();

  // Viền kim loại trong
  const rim = ctx.createLinearGradient(200, 100, 800, 550);
  rim.addColorStop(0, "#e7f7ff");
  rim.addColorStop(.3, "#536d83");
  rim.addColorStop(.65, "#a9c7da");
  rim.addColorStop(1, "#334b60");

  ctx.strokeStyle = rim;
  ctx.lineWidth = 7;
  roundedRect(190, 113, 620, 419, 98);
  ctx.stroke();

  // Mặt kính đen
  const glass = ctx.createLinearGradient(250, 130, 700, 520);
  glass.addColorStop(0, "#102238");
  glass.addColorStop(.18, "#030a14");
  glass.addColorStop(.6, "#020711");
  glass.addColorStop(1, "#091a2a");

  ctx.fillStyle = glass;
  roundedRect(210, 135, 580, 375, 85);
  ctx.fill();

  // Viền kính cyan
  ctx.strokeStyle = "rgba(53,217,255,.55)";
  ctx.lineWidth = 2;
  glow(CYAN, 12);
  roundedRect(210, 135, 580, 375, 85);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Phản chiếu kính
  ctx.save();
  roundedRect(210, 135, 580, 375, 85);
  ctx.clip();

  const reflection = ctx.createLinearGradient(230, 120, 550, 340);
  reflection.addColorStop(0, "rgba(255,255,255,.14)");
  reflection.addColorStop(.35, "rgba(255,255,255,.025)");
  reflection.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = reflection;
  ctx.beginPath();
  ctx.moveTo(250, 135);
  ctx.lineTo(550, 135);
  ctx.lineTo(380, 260);
  ctx.lineTo(230, 260);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // Tai / module kim loại hai bên
  drawSideModule(168, 315, -1);
  drawSideModule(832, 315, 1);

  // Đèn trang trí phía trên
  ctx.fillStyle = CYAN;
  glow(CYAN, 12);
  roundedRect(455, 115, 90, 4, 2);
  ctx.fill();

  ctx.restore();
}

function drawSideModule(x, y, side) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(side, 1);

  const metal = ctx.createLinearGradient(-25, 0, 25, 0);
  metal.addColorStop(0, "#273d51");
  metal.addColorStop(.5, "#c5d7e5");
  metal.addColorStop(1, "#344b60");

  ctx.fillStyle = metal;
  roundedRect(-25, -72, 50, 144, 20);
  ctx.fill();

  ctx.fillStyle = "#071526";
  roundedRect(-17, -57, 34, 114, 13);
  ctx.fill();

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  glow(CYAN, 13);
  roundedRect(-12, -42, 24, 84, 10);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function getEyeStyle(side) {
  let open = blink;
  let tilt = 0;
  let eyeScaleX = 1;
  let eyeScaleY = 1;

  switch (expression) {
    case "happy":
      open *= .78;
      break;
    case "laugh":
      open *= .05;
      break;
    case "sad":
      open *= .76;
      tilt = side === "left" ? -.10 : .10;
      break;
    case "angry":
      open *= .64;
      break;
    case "sleepy":
      open *= .38;
      break;
    case "surprised":
      open *= 1.15;
      eyeScaleY = 1.18;
      eyeScaleX = 1.08;
      break;
    case "excited":
      open *= 1.08;
      eyeScaleY = 1.1;
      break;
    case "curious":
      open *= side === "left" ? .9 : 1.1;
      break;
    case "wink":
      open *= side === "left" ? .05 : 1;
      break;
    case "focused":
      open *= .68;
      break;
    case "love":
      open *= .8;
      break;
  }

  return { open, tilt, eyeScaleX, eyeScaleY };
}
  function drawSleepyEye(w, side) {
  ctx.save();

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 14;

  // Mí mắt khép tự nhiên
  ctx.beginPath();
  ctx.moveTo(-w * 0.72, 3);

  ctx.quadraticCurveTo(
    0,
    22,
    w * 0.72,
    3
  );

  ctx.stroke();

  // Một chút lông mi ở phía ngoài
  ctx.lineWidth = 4;
  ctx.beginPath();

  if (side === "left") {
    ctx.moveTo(-w * 0.55, 8);
    ctx.lineTo(-w * 0.68, 17);
  } else {
    ctx.moveTo(w * 0.55, 8);
    ctx.lineTo(w * 0.68, 17);
  }

  ctx.stroke();
  ctx.restore();
}
function drawEye(x, y, side, t) {
  const s = getEyeStyle(side);

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(s.tilt);

  const breathe = 1 + Math.sin(t * .0018 + (side === "left" ? 0 : 1)) * .012;
  const eyeW = 105 * s.eyeScaleX * breathe;
  const eyeH = 100 * s.eyeScaleY * Math.max(.025, s.open);

  // Quầng sáng mắt
  const aura = ctx.createRadialGradient(0, 0, 5, 0, 0, 100);
  aura.addColorStop(0, "rgba(53,217,255,.20)");
  aura.addColorStop(1, "rgba(53,217,255,0)");

  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.ellipse(0, 0, 100, 85, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hình dạng mắt
  if (expression === "sleepy") {
  drawSleepyEye(eyeW, side);
} else if (expression === "laugh" || expression === "happy") {
  drawClosedSmileEye(eyeW, eyeH, expression === "laugh");
} else if (expression === "love") {
  drawHeart(0, 0, 34);
} else {
  drawOpenEye(eyeW, eyeH, side, t);
}

  ctx.restore();
}


function drawOpenEye(w, h, side, t) {
  ctx.save();

  const pupilX = (gazeX + idleEyeOffsetX) * w * 0.15;
  const pupilY = (gazeY + idleEyeOffsetY) * h * 0.15;

  // Hình dáng mắt tự nhiên hơn
  const eyeW = w * (expression === "surprised" ? 0.48 : 0.44);
  const eyeH = h * (expression === "surprised" ? 0.56 : 0.46);
  // Lớp ánh sáng bên ngoài
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 25;

  const eyeGradient = ctx.createLinearGradient(
    0, -eyeH, 0, eyeH
  );

  eyeGradient.addColorStop(0, WHITE);
  eyeGradient.addColorStop(0.25, LIGHT);
  eyeGradient.addColorStop(0.7, CYAN);
  eyeGradient.addColorStop(1, "#0788bf");

  ctx.fillStyle = eyeGradient;
  ctx.beginPath();
  ctx.ellipse(0, 0, eyeW, eyeH, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // Viền mắt trong suốt
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 2;
  // NƯỚC MẮT CHẢY KHI BUỒN
if (expression === "sad") {
  const tearX = side === "left"
    ? -eyeW * 0.72
    : eyeW * 0.72;

// Nước mắt chảy xuống rồi đọng lại
const tearCycle =
  (t * 0.045 + (side === "right" ? 18 : 0)) % 54;

// Chảy 36 đơn vị, sau đó dừng lại 18 đơn vị
const tearProgress = Math.min(tearCycle, 36);

const tearY = eyeH * 0.28 + tearProgress;

  ctx.save();

  ctx.shadowColor = "#00DFFF";
  ctx.shadowBlur = 16;

  const tearGradient = ctx.createLinearGradient(
    tearX, tearY - 12,
    tearX, tearY + 14
  );

  tearGradient.addColorStop(0, "#D9FFFF");
  tearGradient.addColorStop(0.45, "#42E8FF");
  tearGradient.addColorStop(1, "#0788BF");

  ctx.fillStyle = tearGradient;

  // Hình giọt nước
  ctx.beginPath();
  ctx.moveTo(tearX, tearY - 12);

  ctx.bezierCurveTo(
    tearX - 5, tearY - 5,
    tearX - 8, tearY + 3,
    tearX - 6, tearY + 7
  );

  ctx.quadraticCurveTo(
    tearX, tearY + 17,
    tearX + 6, tearY + 7
  );

  ctx.bezierCurveTo(
    tearX + 8, tearY + 3,
    tearX + 5, tearY - 5,
    tearX, tearY - 12
  );

  ctx.closePath();
  ctx.fill();

  // Ánh sáng phản chiếu trên giọt nước
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.85)";

  ctx.beginPath();
  ctx.ellipse(
    tearX - 2,
    tearY + 2,
    1.8,
    4,
    -0.3,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.restore();
}
  ctx.stroke();

  // Đồng tử
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, eyeW * 0.88, eyeH * 0.88, 0, 0, Math.PI * 2);
  ctx.clip();

  const pupilGradient = ctx.createRadialGradient(
    pupilX - 5, pupilY - 7, 2,
    pupilX, pupilY, w * 0.22
  );

  pupilGradient.addColorStop(0, "#173D58");
  pupilGradient.addColorStop(0.6, "#071B36");
  pupilGradient.addColorStop(1, "#020812");

  ctx.fillStyle = pupilGradient;
  ctx.beginPath();
  ctx.ellipse(
    pupilX, pupilY,
    w * (expression === "surprised" ? 0.15 : 0.19),
    h * (expression === "surprised" ? 0.23 : 0.29),
    0, 0, Math.PI * 2
  );
  ctx.fill();

  // Phản chiếu ánh sáng lớn
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.beginPath();
  ctx.ellipse(
    pupilX - w * 0.065,
    pupilY - h * 0.13,
    w * 0.045,
    h * 0.075,
    -0.4, 0, Math.PI * 2
  );
  ctx.fill();

  // Phản chiếu nhỏ
  ctx.fillStyle = "rgba(184,247,255,0.8)";
  ctx.beginPath();
  ctx.arc(
    pupilX + w * 0.07,
    pupilY + h * 0.1,
    3,
    0, Math.PI * 2
  );
  ctx.fill();

  ctx.restore();

  // Mí mắt theo biểu cảm
  if (["angry", "focused", "sleepy"].includes(expression)) {
    ctx.fillStyle = "#030914";
    ctx.beginPath();

    if (expression === "angry") {
  ctx.beginPath();
      if (side === "left") {
  ctx.moveTo(-w * 0.52, -h * 0.42);
  ctx.lineTo(w * 0.52, -h * 0.02);
  ctx.lineTo(w * 0.52, -h * 0.48);
  ctx.lineTo(-w * 0.52, -h * 0.62);
} else {
  ctx.moveTo(-w * 0.52, -h * 0.02);
  ctx.lineTo(w * 0.52, -h * 0.42);
  ctx.lineTo(w * 0.52, -h * 0.62);
  ctx.lineTo(-w * 0.52, -h * 0.48);
}
} else if (expression === "focused") {
  // Mí mắt tập trung: thấp nhẹ, gần ngang và mỏng
  ctx.moveTo(-w * 0.52, -h * 0.18);
  ctx.quadraticCurveTo(
    0,
    -h * 0.28,
    w * 0.52,
    -h * 0.18
  );

  ctx.lineTo(w * 0.52, -h * 0.38);
  ctx.quadraticCurveTo(
    0,
    -h * 0.48,
    -w * 0.52,
    -h * 0.38
  );
} else {
  ctx.moveTo(-w * 0.5, -h * 0.12);
  ctx.quadraticCurveTo(0, -h * 0.85, w * 0.5, -h * 0.12);
  ctx.lineTo(w * 0.5, -h * 0.5);
  ctx.lineTo(-w * 0.5, -h * 0.5);
}

    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawClosedSmileEye(w, h, laughing) {
  ctx.save();

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = laughing ? 12 : 10;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  glow(CYAN, 20);

  ctx.beginPath();
  ctx.moveTo(-w*.43, h*.15);
  ctx.quadraticCurveTo(0, laughing ? -h*.85 : -h*.65, w*.43, h*.15);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawHeart(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);

  ctx.fillStyle = "#ff78bc";
  glow("#ff78bc", 18);

  ctx.beginPath();
  ctx.moveTo(0, .35);
  ctx.bezierCurveTo(-1, -.2, -1, -.85, 0, -.45);
  ctx.bezierCurveTo(1, -.85, 1, -.2, 0, .35);
  ctx.fill();

  ctx.restore();
}



function drawEyebrows() {
  ctx.save();

  const left = 375;
  const right = 625;

  const leftY = 220 + eyebrowOffset + eyebrowLeftOffset;
  const rightY = 220 + eyebrowOffset + eyebrowRightOffset;

  let color = CYAN;
  let width = 8;

  if (expression === "angry") color = "#ff718b";
  if (expression === "love") color = "#ff78bc";

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  glow(color, 13);

  ctx.beginPath();

  if (expression === "angry") {
    ctx.moveTo(left - 55, leftY - 2);
    ctx.quadraticCurveTo(left + 5, leftY + 2, left + 55, leftY + 35);

    ctx.moveTo(right + 55, rightY - 2);
    ctx.quadraticCurveTo(right - 5, rightY + 2, right - 55, rightY + 35);
  }
  else if (expression === "sad") {
    ctx.moveTo(left - 55, leftY + 15);
    ctx.quadraticCurveTo(left, leftY - 25, left + 55, leftY + 18);

    ctx.moveTo(right - 55, rightY + 18);
    ctx.quadraticCurveTo(right, rightY - 25, right + 55, rightY + 15);
  }
  else if (expression === "surprised") {
  // Lông mày trái: nhướng cao, cong tròn
  ctx.moveTo(left - 48, leftY - 8);
  ctx.quadraticCurveTo(
    left,
    leftY - 55,
    left + 48,
    leftY - 8
  );

  // Lông mày phải: đối xứng
  ctx.moveTo(right - 48, rightY - 8);
  ctx.quadraticCurveTo(
    right,
    rightY - 55,
    right + 48,
    rightY - 8
  );
}
  else if (expression === "focused") {
    ctx.moveTo(left - 50, leftY + 5);
    ctx.lineTo(left + 48, leftY + 20);

    ctx.moveTo(right - 48, rightY + 20);
    ctx.lineTo(right + 50, rightY + 5);
  }
  else if (expression === "sleepy") {
    ctx.moveTo(left - 50, leftY + 12);
    ctx.quadraticCurveTo(left, leftY + 2, left + 50, leftY + 12);

    ctx.moveTo(right - 50, rightY + 12);
    ctx.quadraticCurveTo(right, rightY + 2, right + 50, rightY + 12);
  }
  else {
    ctx.moveTo(left - 48, leftY + 12);
    ctx.quadraticCurveTo(left, leftY - 5, left + 48, leftY + 12);

    ctx.moveTo(right - 48, rightY + 12);
    ctx.quadraticCurveTo(right, rightY - 5, right + 48, rightY + 12);
  }

  ctx.stroke();
  ctx.restore();
}
function drawSleepBubble(t) {
  if (expression !== "sleepy") return;

  // Bong bóng phồng lên và xẹp xuống
  const breathe = (Math.sin(t * 0.002) + 1) / 2;

  const radius = 7 + breathe * 13;
  const x = 550;
  const y = 365;

  ctx.save();

  // Bong bóng phát sáng
  ctx.shadowColor = "#35D9FF";
  ctx.shadowBlur = 18;

  const gradient = ctx.createRadialGradient(
    x - radius * 0.35,
    y - radius * 0.4,
    1,
    x,
    y,
    radius
  );

  gradient.addColorStop(0, "rgba(255,255,255,0.9)");
  gradient.addColorStop(0.35, "rgba(53,217,255,0.45)");
  gradient.addColorStop(1, "rgba(0,180,255,0.12)");

  ctx.fillStyle = gradient;
  ctx.strokeStyle = "#35D9FF";
  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Điểm sáng phản chiếu
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#FFFFFF";

  ctx.beginPath();
  ctx.arc(
    x - radius * 0.35,
    y - radius * 0.35,
    Math.max(1.5, radius * 0.15),
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Bong bóng nhỏ nối với bong bóng chính
  ctx.fillStyle = "rgba(53,217,255,0.6)";
  ctx.beginPath();
  ctx.arc(x - 18, y + 19, 3 + breathe * 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}
function drawMouth(t) {
  ctx.save();

  const y = 420;
  const talking = window.robotTalking === true;

  let color = CYAN;

  if (expression === "angry") color = "#ff718b";
  if (expression === "love") color = "#ff78bc";

  // Miệng mở có răng và lưỡi
  function drawOpenMouth(openAmount = 1) {
    const mouthW = 48;
    const mouthH = 25 * openAmount;

    ctx.save();

    // Khoang miệng
    ctx.shadowColor = "#ff78bc";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#5c1739";

    ctx.beginPath();
    ctx.moveTo(500 - mouthW, y);
    ctx.quadraticCurveTo(
      500, y - 12,
      500 + mouthW, y
    );
    ctx.quadraticCurveTo(
      500 + mouthW * 0.9,
      y + mouthH * 2,
      500,
      y + mouthH * 2
    );
    ctx.quadraticCurveTo(
      500 - mouthW * 0.9,
      y + mouthH * 2,
      500 - mouthW,
      y
    );
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;

    // Răng trắng phía trên
    ctx.fillStyle = "#FFFFFF";
    roundedRect(468, y - 2, 64, 19, 8);
    ctx.fill();

    // Đường phân chia răng
    ctx.strokeStyle = "#dcefff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(500, y);
    ctx.lineTo(500, y + 13);
    ctx.stroke();

    // Lưỡi hồng phía dưới
    ctx.fillStyle = "#ff75a9";
    ctx.beginPath();
    ctx.ellipse(
      500,
      y + mouthH * 1.65,
      25,
      10 * openAmount,
      0,
      Math.PI,
      Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
  }

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  glow(color, 14);

  switch (expression) {
    case "happy":
    case "wink":
      ctx.beginPath();
      ctx.moveTo(455, y);
      ctx.quadraticCurveTo(500, y + 42, 545, y);
      ctx.stroke();
      break;

    case "laugh":
      drawOpenMouth(1.25);
      break;

    case "excited":
      drawOpenMouth(1.05);
      break;

    case "surprised":
  // Khoang miệng hình chữ O
  ctx.fillStyle = "#5c1739";
  ctx.shadowColor = "#ff78bc";
  ctx.shadowBlur = 16;

  ctx.beginPath();
  ctx.ellipse(500, y + 10, 29, 34, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // Viền sáng bên ngoài
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(500, y + 10, 29, 34, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Lưỡi hồng bên trong
  ctx.fillStyle = "#ff75a9";
  ctx.beginPath();
  ctx.ellipse(500, y + 29, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  break;

    case "sad":
      ctx.beginPath();
      ctx.moveTo(455, y + 18);
      ctx.quadraticCurveTo(500, y - 30, 545, y + 18);
      ctx.stroke();
      break;

    case "angry":
  // Khoang miệng
  ctx.save();

  ctx.fillStyle = "#5c1739";
  ctx.beginPath();
  ctx.moveTo(460, y + 3);
  ctx.quadraticCurveTo(500, y + 17, 540, y + 3);
  ctx.lineTo(535, y + 25);
  ctx.quadraticCurveTo(500, y + 33, 465, y + 25);
  ctx.closePath();
  ctx.fill();

  // Giới hạn vùng vẽ răng bên trong khoang miệng
  ctx.clip();

  // Răng trắng
  ctx.fillStyle = "#FFFFFF";
  roundedRect(470, y + 3, 60, 12, 4);
  ctx.fill();

  // Đường phân chia răng
  ctx.strokeStyle = "#dcefff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(500, y + 3);
  ctx.lineTo(500, y + 15);
  ctx.stroke();

  ctx.restore();

  // Viền miệng
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(460, y + 3);
  ctx.quadraticCurveTo(500, y + 34, 540, y + 3);
  ctx.stroke();
  break;
    case "sleepy":
      ctx.beginPath();
      ctx.ellipse(500, y + 8, 15, 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      break;

    case "focused":
      ctx.beginPath();
      ctx.moveTo(480, y + 8);
      ctx.quadraticCurveTo(500, y + 3, 520, y + 8);
      ctx.stroke();
      break;

    case "love":
      ctx.beginPath();
      ctx.moveTo(465, y);
      ctx.quadraticCurveTo(500, y + 35, 535, y);
      ctx.stroke();
      break;

    default:
      ctx.beginPath();
      ctx.moveTo(465, y);
      ctx.quadraticCurveTo(500, y + 25, 535, y);
      ctx.stroke();
      break;
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}


function drawFaceDetails(t) {
  // Đèn trạng thái hai bên mặt
  ctx.save();

  const pulse = .55 + Math.sin(t*.004)*.25;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = CYAN;
  glow(CYAN, 14);

  for (const x of [245, 755]) {
    ctx.beginPath();
    ctx.arc(x, 470, 4, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // Các chấm trang trí dưới cằm
  ctx.save();
  ctx.fillStyle = "rgba(53,217,255,.5)";
  for (let i=0; i<5; i++) {
    ctx.beginPath();
    ctx.arc(480+i*10, 558, 2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawExpressionLayer(t, float, mood, alpha) {
  const savedExpression = expression;
  expression = mood;

  ctx.save();
  ctx.globalAlpha *= alpha;

  drawGoldenRays(t);
  drawEyebrows();
  drawCheeks(t);

  if (expression === "love") {
    drawHeart(375, 315 + float, 35);
    drawHeart(625, 315 + float, 35);
  } else {
    drawEye(375, 320 + float, "left", t);
    drawEye(625, 320 + float, "right", t);
  }

  drawMouth(t);
  drawSleepBubble(t);

  ctx.restore();
  expression = savedExpression;
}
function drawFace(t) {
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  drawMetalFrame(t);

const float = Math.sin(t * .0012) * 2;

// Chuyển tiếp giữa biểu cảm cũ và mới
// Ease-out: chuyển nhanh lúc đầu, nhẹ nhàng khi kết thúc
const transitionProgress =
  1 - Math.pow(1 - expressionTransition, 3);

if (transitionProgress < 1) {
  drawExpressionLayer(
    t,
    float,
    previousExpression,
    1 - transitionProgress
  );
}

drawExpressionLayer(
  t,
  float,
  expression,
  transitionProgress
);

drawFaceDetails(t);

  // Sparkle khi phấn khích
  if (expression === "excited" || expression === "love") {
    ctx.save();
    ctx.fillStyle = CYAN;
    glow(CYAN, 15);

    const sparkle = .4 + Math.sin(t*.008)*.4;
    ctx.globalAlpha = sparkle;

    for (let i=0; i<4; i++) {
      const x = 300 + i*130;
      const y = 190 + Math.sin(t*.002+i)*12;

      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  ctx.restore();
}

// MÁ HỒNG CUTE PREMIUM
function drawCheeks(t) {
  const blushOpacity =
    expression === "love" || expression === "happy" ||
    expression === "laugh" || expression === "excited" ||
    expression === "wink"
      ? 0.85
      : 0.45;

  const pulse = 0.85 + Math.sin(t * 0.003) * 0.15;

  ctx.save();
  ctx.globalAlpha = blushOpacity * pulse;

  for (const x of [285, 715]) {
    const gradient = ctx.createRadialGradient(
      x, 390, 2,
      x, 390, 48
    );

    gradient.addColorStop(0, "rgba(255,105,160,0.65)");
    gradient.addColorStop(0.55, "rgba(255,105,160,0.28)");
    gradient.addColorStop(1, "rgba(255,105,160,0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.ellipse(x, 390, 48, 27, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}


function drawGoldenRays(t) {
  // Chỉ hiển thị khi robot hào hứng hoặc ngạc nhiên
  if (!["excited", "surprised"].includes(expression)) {
    return;
  }

  ctx.save();

  const pulse = 0.8 + Math.sin(t * 0.006) * 0.2;

  ctx.globalAlpha = pulse;
  ctx.strokeStyle = "#FFD166";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.shadowColor = "#FFB52E";
  ctx.shadowBlur = 14;

  // Tia sáng đối xứng ở giữa đầu
  const rays = [
    [440, 105, 425, 76],
    [465, 91, 458, 58],
    [490, 84, 488, 48],
    [510, 84, 512, 48],
    [535, 91, 542, 58],
    [560, 105, 575, 76]
  ];

  rays.forEach(([x1, y1, x2, y2]) => {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });

  ctx.restore();
}


function setExpression(mood, duration = 0) {
  const valid = [
    "neutral", "happy", "sad", "angry",
    "laugh", "excited", "sleepy", "curious",
    "surprised", "wink", "focused", "love"
  ];

  if (!valid.includes(mood)) mood = "neutral";

if (expression !== mood) {
  previousExpression = expression;
  expression = mood;
  expressionTransition = 0;
}
  blinkTarget = 1;

  expressionUntil = duration > 0
    ? performance.now() + duration
    : 0;
}


function randomIdleExpression(now) {
  if (guestPresent || photoboothActive || now < nextIdleChange) return;

const choices = [
  ["neutral", 4000],
  ["curious", 4500],
  ["sleepy", 5000],
  ["wink", 3500],
  ["happy", 4500],
  ["laugh", 4000],
  ["excited", 4500],
  ["surprised", 4000],
  ["love", 4500],
  ["sad", 4000],
  ["angry", 4000],
  ["focused", 4500]
];

  const choice = choices[Math.floor(Math.random() * choices.length)];

  setExpression(choice[0], choice[1]);

  // Nghỉ 2–3 giây trước khi chuyển sang biểu cảm tiếp theo
nextIdleChange = now + 2000 + Math.random() * 1000;
}

function updateAnimation(t) {
  randomIdleExpression(t);
  // Chuyển biểu cảm nhanh và mượt trong khoảng 250ms
expressionTransition += 16 / 250;
expressionTransition = Math.min(1, expressionTransition);
  if (expressionUntil > 0 && t > expressionUntil &&
      !guestPresent && !photoboothActive) {
    setExpression("neutral");
    expressionUntil = 0;
  }

  if (t-lastGazeChange > 3500 + Math.random()*1800) {
    if (!guestPresent && !photoboothActive) {
      targetGazeX = (Math.random()-.5)*.7;
      targetGazeY = (Math.random()-.5)*.4;
    }
    lastGazeChange = t;
  }

  // Natural Eye Tracking
const eyeSmoothness = guestPresent ? 0.085 : 0.045;

gazeX += (targetGazeX - gazeX) * eyeSmoothness;
gazeY += (targetGazeY - gazeY) * eyeSmoothness;
// Natural idle eye movement
if (!guestPresent && !photoboothActive) {
  if (t > nextIdleEyeMove) {
    targetIdleEyeX = (Math.random() - 0.5) * 0.12;
    targetIdleEyeY = (Math.random() - 0.5) * 0.08;

    nextIdleEyeMove = t + 2500 + Math.random() * 2500;
  }
} else {
  targetIdleEyeX = 0;
  targetIdleEyeY = 0;
}

// Smooth idle movement
idleEyeOffsetX += (targetIdleEyeX - idleEyeOffsetX) * 0.035;
idleEyeOffsetY += (targetIdleEyeY - idleEyeOffsetY) * 0.035;
  // Smooth eyelid animation
const blinkSpeed = blinkTarget < blink ? 0.42 : 0.22;
blink += (blinkTarget - blink) * blinkSpeed;

// Giới hạn độ mở mắt
blink = Math.max(0.025, Math.min(1, blink));
// Micro Expression - Asymmetric Eyebrow Movement
if (expression === "neutral" && !photoboothActive) {
  if (t > nextEyebrowMove) {
    targetEyebrowOffset = (Math.random() - 0.5) * 2;

    targetEyebrowLeft = (Math.random() - 0.5) * 5;
    targetEyebrowRight = (Math.random() - 0.5) * 5;

    nextEyebrowMove = t + 2500 + Math.random() * 3500;
  }
} else {
  targetEyebrowOffset = 0;
  targetEyebrowLeft = 0;
  targetEyebrowRight = 0;
}

// Smooth eyebrow movement
eyebrowOffset += (targetEyebrowOffset - eyebrowOffset) * 0.035;

eyebrowLeftOffset += (targetEyebrowLeft - eyebrowLeftOffset) * 0.035;
eyebrowRightOffset += (targetEyebrowRight - eyebrowRightOffset) * 0.035;
}

function animate(t) {
  drawBackground(t);

  updateAnimation(t);

  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawFace(t);
  ctx.restore();

  requestAnimationFrame(animate);
}


function scheduleBlink() {
  // Chu kỳ chớp mắt ngẫu nhiên
  const delay = 2800 + Math.random() * 3200;

  setTimeout(() => {
    // Không chớp khi đang cười lớn hoặc ngủ
    if (
      expression !== "laugh" &&
      expression !== "sleepy"
    ) {
      // Chớp mắt lần 1
      blinkTarget = 0.04;

      setTimeout(() => {
        blinkTarget = 1;

        // 22% cơ hội chớp mắt kép
        if (Math.random() < 0.22) {
          setTimeout(() => {
            blinkTarget = 0.04;

            setTimeout(() => {
              blinkTarget = 1;
            }, 130);

          }, 220);
        }

      }, 130);
    }

    scheduleBlink();

  }, delay);
}

scheduleBlink();


// KẾT NỐI ROBOT SERVER ONLINE
let socket;
let reconnectTimer;

const socketUrl = "wss://photobooth-robot-ai.onrender.com";

function connectServer() {
  socket = new WebSocket(socketUrl);

  socket.onopen = () => {
    connection.classList.add("connected");
    connectionText.textContent = "CONNECTED";
    console.log("Robot Server connected:", socketUrl);
  };

  socket.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      // Nhận vị trí khuôn mặt từ Camera AI
      if (data.type === "tracking") {
        targetGazeX = data.x;
        targetGazeY = data.y;
}
      // Nhận biểu cảm trực tiếp từ Camera AI
      if (data.expression) {
        setExpression(data.expression);
      }

      // Nhận diện khách
if (data.type === "presence") {
  guestPresent = !!data.present;

  if (!guestPresent && !photoboothActive) {
    targetGazeX = 0;
    targetGazeY = 0;

    setExpression("neutral");
    nextIdleChange = performance.now() + 2500;
  }
}

      // Nhận trạng thái Photobooth
      if (data.type === "photobooth") {
        if (data.stage === "countdown") {
          photoboothActive = true;
          setExpression("focused");
        }

        if (data.stage === "captured") {
          photoboothActive = true;
          setExpression("laugh");
        }

        if (data.stage === "finished") {
          photoboothActive = false;
          setExpression(guestPresent ? "happy" : "neutral");
          nextIdleChange = performance.now()+3000;
        }
      }

    } catch (error) {
      console.error("WebSocket message error:", error);
    }
  };

  socket.onclose = () => {
    connection.classList.remove("connected");
    connectionText.textContent = "RECONNECTING";

    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectServer, 2000);
  };

  socket.onerror = () => socket.close();
}

connectServer();
requestAnimationFrame(animate);
</script>
